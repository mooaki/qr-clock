<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3連QR時計</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:12px;font-family:system-ui,sans-serif}
main{width:min(100%,900px)}
.codes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,2vw,20px)}
.code{text-align:center;min-width:0}
.label{font-size:clamp(1rem,3vw,1.4rem);font-weight:700;margin-bottom:8px}
.qr{width:100%;aspect-ratio:1;background:#fff;padding:4px;display:grid;place-items:center}
.qr img,.qr canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
@media(max-width:420px){body{padding:6px}.codes{gap:5px}.qr{padding:2px}.label{margin-bottom:4px}}
</style>
</head>
<body>
<main>
<div class="codes">
<section class="code"><div class="label">時</div><div class="qr" id="hour"></div></section>
<section class="code"><div class="label">分</div><div class="qr" id="minute"></div></section>
<section class="code"><div class="label">秒</div><div class="qr" id="second"></div></section>
</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const boxes={hour:document.getElementById('hour'),minute:document.getElementById('minute'),second:document.getElementById('second')};
const previous={hour:'',minute:'',second:''};
function draw(box,value){
  box.replaceChildren();
  new QRCode(box,{text:value,width:256,height:256,correctLevel:QRCode.CorrectLevel.M});
}
function tick(){
  const d=new Date();
  const values={
    hour:String(d.getHours()).padStart(2,'0'),
    minute:String(d.getMinutes()).padStart(2,'0'),
    second:String(d.getSeconds()).padStart(2,'0')
  };
  for(const key of Object.keys(values)){
    if(values[key]!==previous[key]){draw(boxes[key],values[key]);previous[key]=values[key];}
  }
}
tick();
setInterval(tick,100);
</script>
</body>
</html>
